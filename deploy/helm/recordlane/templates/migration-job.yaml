apiVersion: batch/v1
kind: Job
metadata:
  name: "recordlane-migrate-{{ .Release.Revision }}"
  annotations: {"helm.sh/hook": "pre-install,pre-upgrade", "helm.sh/hook-delete-policy": before-hook-creation}
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          command: [python, -m, recordlane.operations.migrate]
          env:
            - {name: RECORDLANE_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.database.migrationSecretName }}, key: {{ .Values.database.migrationUrlKey }}}}}
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
