apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "recordlane.name" . }}, labels: {app.kubernetes.io/name: recordlane}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: recordlane, app.kubernetes.io/component: api}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app.kubernetes.io/name: recordlane, app.kubernetes.io/component: api}}
    spec:
      serviceAccountName: recordlane
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app.kubernetes.io/name: recordlane, app.kubernetes.io/component: api}}}
      containers:
        - name: web
          image: "{{ .Values.image.web }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: web, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: web}, periodSeconds: 10, timeoutSeconds: 3}
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: web-tmp, mountPath: /tmp}]
        - name: api
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: RECORDLANE_ENVIRONMENT, value: production}
            - {name: RECORDLANE_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.database.secretName }}, key: {{ .Values.database.urlKey }}}}}
            - {name: RECORDLANE_OIDC_ISSUER, value: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}}
            - {name: RECORDLANE_OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }}}
            - {name: RECORDLANE_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }}}
            - {name: RECORDLANE_PUBLIC_URL, value: {{ .Values.publicUrl | quote }}}
            - {name: RECORDLANE_ALLOWED_ORIGINS, value: {{ .Values.allowedOrigins | quote }}}
            - {name: RECORDLANE_ALLOWED_HOSTS, value: {{ .Values.allowedHosts | quote }}}
            - {name: RECORDLANE_SESSION_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.sessionSecret.secretName }}, key: {{ .Values.sessionSecret.key }}}}}
            - {name: RECORDLANE_MASTER_KEY_FILE, value: /run/recordlane/master-key}
            - {name: RECORDLANE_SCIM_TOKEN_FILE, value: /run/recordlane-scim/scim-token}
            - {name: RECORDLANE_METRICS_TOKEN_FILE, value: /run/recordlane-metrics/metrics-token}
          volumeMounts:
            - {name: master-key, mountPath: /run/recordlane, readOnly: true}
            - {name: scim-token, mountPath: /run/recordlane-scim, readOnly: true}
            - {name: metrics-token, mountPath: /run/recordlane-metrics, readOnly: true}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders: [{name: Host, value: {{ .Values.probeHost | quote }} }]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders: [{name: Host, value: {{ .Values.probeHost | quote }} }]
            periodSeconds: 20
            timeoutSeconds: 3
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - {name: master-key, secret: {secretName: {{ .Values.masterKey.secretName }}, items: [{key: {{ .Values.masterKey.key }}, path: master-key}]}}
        - {name: scim-token, secret: {secretName: {{ .Values.scimToken.secretName }}, items: [{key: {{ .Values.scimToken.key }}, path: scim-token}]}}
        - {name: metrics-token, secret: {secretName: {{ .Values.metricsToken.secretName }}, items: [{key: {{ .Values.metricsToken.key }}, path: metrics-token}]}}
        - {name: web-tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: recordlane-worker, labels: {app.kubernetes.io/name: recordlane, app.kubernetes.io/component: worker}}
spec:
  replicas: {{ .Values.workerReplicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: recordlane, app.kubernetes.io/component: worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: recordlane, app.kubernetes.io/component: worker}}
    spec:
      serviceAccountName: recordlane
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: "{{ .Values.image.api }}:{{ .Values.image.tag }}"
          command: [python, -m, recordlane.jobs.worker]
          env:
            - {name: RECORDLANE_ENVIRONMENT, value: production}
            - {name: RECORDLANE_DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ .Values.database.secretName }}, key: {{ .Values.database.urlKey }}}}}
            - {name: RECORDLANE_OIDC_ISSUER, value: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}}
            - {name: RECORDLANE_OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }}}
            - {name: RECORDLANE_OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }}}
            - {name: RECORDLANE_PUBLIC_URL, value: {{ .Values.publicUrl | quote }}}
            - {name: RECORDLANE_ALLOWED_ORIGINS, value: {{ .Values.allowedOrigins | quote }}}
            - {name: RECORDLANE_ALLOWED_HOSTS, value: {{ .Values.allowedHosts | quote }}}
            - {name: RECORDLANE_SESSION_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.sessionSecret.secretName }}, key: {{ .Values.sessionSecret.key }}}}}
            - {name: RECORDLANE_MASTER_KEY_FILE, value: /run/recordlane/master-key}
            - {name: RECORDLANE_SCIM_TOKEN_FILE, value: /run/recordlane-scim/scim-token}
            - {name: RECORDLANE_METRICS_TOKEN_FILE, value: /run/recordlane-metrics/metrics-token}
          volumeMounts:
            - {name: master-key, mountPath: /run/recordlane, readOnly: true}
            - {name: scim-token, mountPath: /run/recordlane-scim, readOnly: true}
            - {name: metrics-token, mountPath: /run/recordlane-metrics, readOnly: true}
          resources: {{ toYaml .Values.resources.worker | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - {name: master-key, secret: {secretName: {{ .Values.masterKey.secretName }}, items: [{key: {{ .Values.masterKey.key }}, path: master-key}]}}
        - {name: scim-token, secret: {secretName: {{ .Values.scimToken.secretName }}, items: [{key: {{ .Values.scimToken.key }}, path: scim-token}]}}
        - {name: metrics-token, secret: {secretName: {{ .Values.metricsToken.secretName }}, items: [{key: {{ .Values.metricsToken.key }}, path: metrics-token}]}}
