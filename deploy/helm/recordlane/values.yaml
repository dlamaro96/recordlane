replicaCount: 2
workerReplicaCount: 2
image:
  api: ghcr.io/dlamaro96/recordlane-api
  web: ghcr.io/dlamaro96/recordlane-web
  tag: 0.1.0-alpha.3
  pullPolicy: IfNotPresent
database:
  secretName: recordlane-database
  urlKey: database-url
  migrationSecretName: recordlane-migration-database
  migrationUrlKey: database-url
oidc:
  issuer: ""
  audience: recordlane
  clientId: recordlane
publicUrl: https://recordlane.example.com
probeHost: recordlane.example.com
allowedOrigins: '["https://recordlane.example.com"]'
allowedHosts: '["recordlane.example.com","api"]'
sessionSecret:
  secretName: recordlane-session
  key: session-secret
masterKey:
  secretName: recordlane-master-key
  key: master-key
scimToken:
  secretName: recordlane-scim
  key: scim-token
metricsToken:
  secretName: recordlane-metrics
  key: metrics-token
ingress:
  enabled: false
  className: ""
  host: recordlane.example.com
  tlsSecretName: ""
resources:
  api: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  web: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
  worker: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
networkPolicy:
  enabled: true
  allowedEgressCIDRs: []
