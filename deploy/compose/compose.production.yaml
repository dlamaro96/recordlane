name: recordlane
services:
  migrate:
    image: ghcr.io/dlamaro96/recordlane-api:0.1.0-alpha.3
    command: ["python", "-m", "recordlane.operations.migrate"]
    env_file: [.env.production]
    environment:
      RECORDLANE_DATABASE_URL: ${RECORDLANE_MIGRATION_DATABASE_URL:?set a privileged migration database URL}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: "no"
  api:
    image: ghcr.io/dlamaro96/recordlane-api:0.1.0-alpha.3
    env_file: [.env.production]
    secrets: [recordlane-master-key, recordlane-scim-token, recordlane-metrics-token]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"], interval: 10s, timeout: 3s, retries: 12}
    restart: unless-stopped
  worker:
    image: ghcr.io/dlamaro96/recordlane-api:0.1.0-alpha.3
    command: ["python", "-m", "recordlane.jobs.worker"]
    env_file: [.env.production]
    secrets: [recordlane-master-key, recordlane-scim-token, recordlane-metrics-token]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  web:
    image: ghcr.io/dlamaro96/recordlane-web:0.1.0-alpha.3
    ports: ["${RECORDLANE_BIND_ADDRESS:-127.0.0.1}:${RECORDLANE_PORT:-8088}:8080"]
    depends_on: {api: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
secrets:
  recordlane-master-key:
    file: ./secrets/recordlane-master-key.txt
  recordlane-scim-token:
    file: ./secrets/recordlane-scim-token.txt
  recordlane-metrics-token:
    file: ./secrets/recordlane-metrics-token.txt
