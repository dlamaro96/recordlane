global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/recordlane-alerts.yml
scrape_configs:
  - job_name: recordlane-api
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/recordlane-metrics-token
    static_configs:
      - targets: [api:8000]
