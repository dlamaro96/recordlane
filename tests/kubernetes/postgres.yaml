apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: recordlane-postgres}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: postgres
      image: recordlane-postgres:17.6
      imagePullPolicy: Never
      env:
        - {name: POSTGRES_DB, value: recordlane}
        - {name: POSTGRES_USER, value: recordlane_migrator}
        - {name: POSTGRES_PASSWORD, value: demo-only-migrator}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
      ports: [{name: postgres, containerPort: 5432}]
      readinessProbe:
        exec: {command: [pg_isready, -U, recordlane_migrator, -d, recordlane]}
        periodSeconds: 1
        timeoutSeconds: 1
        failureThreshold: 120
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: run, mountPath: /var/run/postgresql}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - {name: data, emptyDir: {sizeLimit: 512Mi}}
    - {name: run, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
    - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app.kubernetes.io/name: recordlane-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
