schema_version: "1.0"
platform_compatibility: ">=0.1.0-alpha.1,<0.2.0"
connectors:
  - id: files
    formats: [csv, jsonl, parquet]
    direction: [read, write]
    full_read: true
    incremental: explicit_manifest_cursor
    deletions: explicit_tombstones_only
    auth: [filesystem_permissions]
    write_operations: [export]
    checkpoint: record_count_and_manifest_checksum
    consistency: atomic_rename_when_supported
    validation: integration_tested
    limitations: [streaming memory bounds depend on the selected parser and batch size]
  - id: postgresql
    direction: [read, controlled_write]
    full_read: true
    incremental: timestamp_and_stable_tiebreaker
    deletions: configured_tombstones
    auth: [password, tls_client_certificate]
    write_operations: [upsert_with_explicit_ownership]
    checkpoint: source_timestamp_and_primary_key
    consistency: source_snapshot_dependent
    validation: local_postgresql_17_integration_tested
  - id: http-rest
    direction: [read]
    full_read: true
    incremental: cursor
    deletions: envelope_dependent
    auth: [bearer, basic, oauth2_client_credentials, custom_header_secret_reference]
    write_operations: []
    checkpoint: durable_cursor_after_processing
    consistency: remote_api_dependent
    validation: local_paginated_http_integration_tested
  - id: odata
    direction: [read]
    full_read: true
    incremental: delta_link_when_supplied
    deletions: delta_envelope_dependent
    auth: [oauth2_client_credentials, bearer]
    write_operations: []
    checkpoint: nextLink_or_deltaLink
    consistency: service_dependent
    validation: contract_tested_no_live_vendor_credentials
  - id: inbound-webhook
    direction: [read]
    full_read: false
    incremental: event_id
    deletions: explicit_event
    auth: [hmac_sha256, oidc_bearer]
    write_operations: []
    checkpoint: event_id_after_durable_recording
    consistency: at_least_once
    validation: local_signed_event_integration_tested
  - id: outbound-webhook
    direction: [write]
    full_read: false
    incremental: outbox_event
    deletions: corrective_event
    auth: [hmac_sha256]
    write_operations: [approved_event_delivery]
    checkpoint: per_destination_delivery_attempt
    consistency: at_least_once
    validation: local_idempotent_consumer_integration_tested
  - id: s3-compatible
    direction: [read, write]
    full_read: true
    incremental: versioned_manifest
    deletions: explicit_manifest
    auth: [secret_reference, workload_identity_if_driver_supports]
    write_operations: [object_export]
    checkpoint: object_version_and_checksum
    consistency: provider_dependent
    validation: signed_url_contract_tested_no_live_vendor_credentials
  - id: azure-blob
    direction: [read, write]
    full_read: true
    incremental: versioned_manifest
    deletions: explicit_manifest
    auth: [managed_identity, secret_reference]
    write_operations: [blob_export]
    checkpoint: etag_and_checksum
    consistency: provider_dependent
    validation: signed_url_contract_tested_no_live_vendor_credentials
  - id: google-cloud-storage
    direction: [read, write]
    full_read: true
    incremental: versioned_manifest
    deletions: explicit_manifest
    auth: [application_default_credentials, workload_identity]
    write_operations: [object_export]
    checkpoint: generation_and_checksum
    consistency: provider_dependent
    validation: signed_url_contract_tested_no_live_vendor_credentials
