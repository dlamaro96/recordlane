name: Performance evidence
description: Submit a reproducible workload and observed measurements.
labels: [performance, triage]
body:
  - type: textarea
    id: environment
    attributes: {label: Hardware, architecture, versions, and configuration}
    validations: {required: true}
  - type: textarea
    id: workload
    attributes: {label: Synthetic dataset, command, repetitions, and raw measurements}
    validations: {required: true}
