name: security
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: '17 3 * * 2'}]
permissions: {contents: read, security-events: write}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source=/repo --no-banner
      - run: docker build -t recordlane-api:test backend && docker build -t recordlane-web:test apps/web
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity CRITICAL,HIGH recordlane-api:test
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --exit-code 1 --severity CRITICAL,HIGH recordlane-web:test
