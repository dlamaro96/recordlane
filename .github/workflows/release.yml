name: release
on: {workflow_dispatch: {inputs: {tag: {description: 'Existing semver prerelease tag', required: true, type: string}}}}
permissions: {contents: write, packages: write, id-token: write, attestations: write}
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Verify exact tagged input
        env: {RELEASE_TAG: '${{ inputs.tag }}'}
        run: |
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*-*) ;; *) exit 2;; esac
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
      - name: Reject incomplete prepublication evidence
        run: python3 scripts/release_gate.py --phase prepublication
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}
      - name: Build and publish multi-architecture images
        env:
          RELEASE_TAG: '${{ inputs.tag }}'
          IMAGE_ROOT: 'ghcr.io/${{ github.repository_owner }}'
        run: |
          version="${RELEASE_TAG#v}"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --push -t "$IMAGE_ROOT/recordlane-api:$version" backend
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=mode=max --sbom=true --push -t "$IMAGE_ROOT/recordlane-web:$version" apps/web
          mkdir -p dist
          docker buildx imagetools inspect "$IMAGE_ROOT/recordlane-api:$version" --format '{{json .Manifest}}' > dist/recordlane-api-manifest.json
          docker buildx imagetools inspect "$IMAGE_ROOT/recordlane-web:$version" --format '{{json .Manifest}}' > dist/recordlane-web-manifest.json
          api_digest="$(jq -r .digest dist/recordlane-api-manifest.json)"
          web_digest="$(jq -r .digest dist/recordlane-web-manifest.json)"
          cosign sign --yes "$IMAGE_ROOT/recordlane-api@$api_digest"
          cosign sign --yes "$IMAGE_ROOT/recordlane-web@$web_digest"
      - name: Build source, Helm, SDK, ecosystem, and documentation artifacts
        env:
          RELEASE_TAG: '${{ inputs.tag }}'
          GH_TOKEN: '${{ github.token }}'
        run: |
          ./scripts/build_release.sh "$RELEASE_TAG"
          mkdir -p _release
          gh repo clone "${{ github.repository_owner }}/recordlane-python" _release/python -- --depth 1
          gh repo clone "${{ github.repository_owner }}/recordlane-typescript" _release/typescript -- --depth 1
          gh repo clone "${{ github.repository_owner }}/recordlane-ecosystem" _release/ecosystem -- --depth 1
          gh repo clone "${{ github.repository_owner }}/recordlane-docs" _release/docs -- --depth 1
          python -m pip install --disable-pip-version-check build
          python -m build --outdir "$GITHUB_WORKSPACE/dist" _release/python
          python -m build --outdir "$GITHUB_WORKSPACE/dist" _release/ecosystem
          (cd _release/typescript && npm ci && npm test && npm run build && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          tar -C _release/docs -czf "dist/recordlane-docs-${RELEASE_TAG#v}.tar.gz" --exclude=.git .
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | xargs sha256sum) > dist/SHA256SUMS
          cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'dist/*'}
      - name: Publish immutable candidate release
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ inputs.tag }}'}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --prerelease --title "Recordlane ${RELEASE_TAG#v}"
