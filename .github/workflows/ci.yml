name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with: {node-version: '20.19.6', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -e 'backend[test]'
      - run: RECORDLANE_DEMO_MODE=true RECORDLANE_DATABASE_URL=sqlite:////tmp/recordlane-ci.db backend/.venv/bin/pytest tests/unit tests/property tests/integration
      - run: npm ci --prefix apps/web && npm --prefix apps/web test && npm --prefix apps/web run build
      - run: PYTHONPATH=backend/src backend/.venv/bin/python scripts/export_openapi.py && git diff --exit-code contracts/openapi/openapi.json
      - run: backend/.venv/bin/python scripts/validate_requirements.py
  compose-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with: {node-version: '20.19.6', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --prefix apps/web && npx --prefix apps/web playwright install --with-deps chromium
      - run: docker compose -f deploy/compose/compose.demo.yaml up -d --build --wait
      - run: npm --prefix apps/web run test:e2e
      - if: always()
        run: docker compose -f deploy/compose/compose.demo.yaml logs --no-color > compose.log && docker compose -f deploy/compose/compose.demo.yaml down -v
