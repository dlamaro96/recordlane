name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with: {node-version: '20.19.6', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -e 'backend[test]'
      - run: backend/.venv/bin/ruff check backend/src tests scripts
      - run: RECORDLANE_DEMO_MODE=true RECORDLANE_DATABASE_URL=sqlite:////tmp/recordlane-ci.db backend/.venv/bin/pytest tests/unit tests/property tests/integration
      - run: npm ci --prefix apps/web && npm --prefix apps/web test && npm --prefix apps/web run build
      - run: PYTHONPATH=backend/src backend/.venv/bin/python scripts/export_openapi.py && git diff --exit-code contracts/openapi/openapi.json
      - run: backend/.venv/bin/python scripts/validate_requirements.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env: {POSTGRES_DB: recordlane_test_ci, POSTGRES_USER: recordlane_migrator, POSTGRES_PASSWORD: ci-only-migrator}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recordlane_migrator -d recordlane_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -e 'backend[test]'
      - name: PostgreSQL lifecycle, authorization, RLS, concurrency, and connectors
        env:
          RECORDLANE_TEST_DATABASE_URL: postgresql+psycopg://recordlane_migrator:ci-only-migrator@127.0.0.1:5432/recordlane_test_ci
          RECORDLANE_CONNECTOR_TEST_DATABASE_URL: postgresql+psycopg://recordlane_migrator:ci-only-migrator@127.0.0.1:5432/recordlane_test_ci
        run: >-
          backend/.venv/bin/pytest
          tests/integration/test_source_object_lifecycle.py
          tests/integration/test_field_authorization.py
          tests/integration/test_postgres_rls.py
          tests/integration/test_postgres_connector.py
          tests/integration/test_publication_reconciliation.py
          tests/integration/test_ingestion_recovery.py
  compose-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with: {node-version: '20.19.6', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --prefix apps/web && npx --prefix apps/web playwright install --with-deps chromium
      - name: Start demo and verify the one-shot loader
        run: |
          docker compose -f deploy/compose/compose.demo.yaml up -d --build
          docker compose -f deploy/compose/compose.demo.yaml wait demo-loader
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8088/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm --prefix apps/web run test:e2e
      - if: always()
        run: docker compose -f deploy/compose/compose.demo.yaml logs --no-color > compose.log && docker compose -f deploy/compose/compose.demo.yaml down -v
